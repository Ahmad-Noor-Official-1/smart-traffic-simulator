<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Traffic Simulator</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        background: #171717;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .app {
        width: min(1100px, 96vw);
    }
    h1 {
        text-align: center;
        margin: 0 0 14px;
        font-size: 24px;
    }
    .stage {
        position: relative;
        width: 100%;
        aspect-ratio: 900 / 500;
        overflow: hidden;
        background: #4f944f;
        border: 2px solid #333;
        border-radius: 10px;
        box-shadow: 0 12px 35px #0008;
    }
    canvas {
        width: 100%;
        height: 100%;
        display: block;
    }
    .hint {
        text-align: center;
        color: #aaa;
        margin-top: 9px;
        font-size: 12px;
    }
</style>
</head>
<body>
<div class="app">
    <h1>Smart Traffic Simulator</h1>
    <div class="stage">
        <canvas id="traffic" width="900" height="500"></canvas>
    </div>
    <div class="hint">Adaptive traffic control simulation • Green time changes according to traffic density</div>
</div>

<script>
const canvas = document.getElementById("traffic");
const ctx = canvas.getContext("2d");

const WIDTH = 900;
const HEIGHT = 500;

const ROAD_TOP = 190;
const ROAD_BOTTOM = 310;
const ROAD_LEFT = 390;
const ROAD_RIGHT = 510;

const CAR_WIDTH = 32;
const CAR_HEIGHT = 16;

const SPEED = 1.3;
const YELLOW_TIME = 5;
const MIN_GREEN_TIME = 15;
const MAX_GREEN_TIME = 30;

let cars = [];
let totalCars = 0;
let passedCars = 0;

let lightPhase = "horizontal_green";
let lightTimer = 0;

let horizontalGreenTime = 15;
let verticalGreenTime = 15;

let spawnTimer = 0;
let nextSpawnDelay = 1.5 + Math.random() * 2.5;
let lastTime = performance.now();

const colors = ["#e74c3c","#3498db","#f1c40f","#9b59b6","#ffffff","#e67e22"];

class Car {
    constructor(direction) {
        this.direction = direction;

        if (direction === "down") {
            this.x = 470;
            this.y = -50;
        } else if (direction === "up") {
            this.x = 410;
            this.y = HEIGHT + 50;
        } else if (direction === "right") {
            this.x = -50;
            this.y = 220;
        } else {
            this.x = WIDTH + 50;
            this.y = 270;
        }

        this.color = colors[Math.floor(Math.random() * colors.length)];
    }

    lightIsGreen() {
        if (this.direction === "right" || this.direction === "left")
            return lightPhase === "horizontal_green";

        if (this.direction === "up" || this.direction === "down")
            return lightPhase === "vertical_green";

        return false;
    }

    blockedByCar() {
        const SAFE_GAP = 12;

        for (const other of cars) {
            if (other === this) continue;
            if (other.direction !== this.direction) continue;

            if (this.direction === "right") {
                const gap = other.x - (this.x + CAR_WIDTH);
                if (other.x > this.x && gap <= SAFE_GAP) return true;
            }

            if (this.direction === "left") {
                const gap = this.x - (other.x + CAR_WIDTH);
                if (other.x < this.x && gap <= SAFE_GAP) return true;
            }

            if (this.direction === "down") {
                const gap = other.y - (this.y + CAR_WIDTH);
                if (other.y > this.y && gap <= SAFE_GAP) return true;
            }

            if (this.direction === "up") {
                const gap = this.y - (other.y + CAR_WIDTH);
                if (other.y < this.y && gap <= SAFE_GAP) return true;
            }
        }

        return false;
    }

    blockedByLight() {
        if (this.lightIsGreen()) return false;

        if (this.direction === "right") {
            const stopLine = 350;
            if (this.x < stopLine && this.x + CAR_WIDTH + SPEED >= stopLine) return true;
            if (this.x < stopLine && this.x + CAR_WIDTH >= stopLine - 2) return true;
        }

        if (this.direction === "left") {
            const stopLine = 550;
            if (this.x > stopLine && this.x - SPEED <= stopLine) return true;
            if (this.x > stopLine && this.x <= stopLine + 2) return true;
        }

        if (this.direction === "down") {
            const stopLine = 170;
            if (this.y < stopLine && this.y + CAR_HEIGHT + SPEED >= stopLine) return true;
            if (this.y < stopLine && this.y + CAR_HEIGHT >= stopLine - 2) return true;
        }

        if (this.direction === "up") {
            const stopLine = 330;
            if (this.y > stopLine && this.y - SPEED <= stopLine) return true;
            if (this.y > stopLine && this.y <= stopLine + 2) return true;
        }

        return false;
    }

    move() {
        // First respect traffic lights.
        if (this.blockedByLight()) return;

        // Calculate the maximum movement allowed before reaching
        // the car directly in front. This prevents cars from ever
        // visually touching or overlapping, even during fast updates.
        const SAFE_GAP = 12;
        let allowedMove = SPEED;

        for (const other of cars) {
            if (other === this) continue;
            if (other.direction !== this.direction) continue;

            if (this.direction === "right" && other.x > this.x) {
                const gap = other.x - (this.x + CAR_WIDTH);
                allowedMove = Math.min(allowedMove, Math.max(0, gap - SAFE_GAP));
            }

            if (this.direction === "left" && other.x < this.x) {
                const gap = this.x - (other.x + CAR_WIDTH);
                allowedMove = Math.min(allowedMove, Math.max(0, gap - SAFE_GAP));
            }

            if (this.direction === "down" && other.y > this.y) {
                const gap = other.y - (this.y + CAR_WIDTH);
                allowedMove = Math.min(allowedMove, Math.max(0, gap - SAFE_GAP));
            }

            if (this.direction === "up" && other.y < this.y) {
                const gap = this.y - (other.y + CAR_WIDTH);
                allowedMove = Math.min(allowedMove, Math.max(0, gap - SAFE_GAP));
            }
        }

        if (allowedMove <= 0) return;

        if (this.direction === "right") this.x += allowedMove;
        else if (this.direction === "left") this.x -= allowedMove;
        else if (this.direction === "down") this.y += allowedMove;
        else if (this.direction === "up") this.y -= allowedMove;
    }

    draw() {
        ctx.fillStyle = this.color;
        ctx.strokeStyle = "black";
        ctx.lineWidth = 1;

        if (this.direction === "right" || this.direction === "left") {
            ctx.fillRect(this.x, this.y, CAR_WIDTH, CAR_HEIGHT);
            ctx.strokeRect(this.x, this.y, CAR_WIDTH, CAR_HEIGHT);
        } else {
            ctx.fillRect(this.x, this.y, CAR_HEIGHT, CAR_WIDTH);
            ctx.strokeRect(this.x, this.y, CAR_HEIGHT, CAR_WIDTH);
        }
    }
}

function countRoadCars(group) {
    let count = 0;

    for (const car of cars) {
        // Use the exact dimensions used by draw(), so the number matches
        // the cars that are actually visible on the canvas.
        let carWidth, carHeight;

        if (car.direction === "right" || car.direction === "left") {
            carWidth = CAR_WIDTH;
            carHeight = CAR_HEIGHT;
        } else {
            carWidth = CAR_HEIGHT;
            carHeight = CAR_WIDTH;
        }

        const visible =
            car.x + carWidth > 0 &&
            car.x < WIDTH &&
            car.y + carHeight > 0 &&
            car.y < HEIGHT;

        if (!visible) continue;

        if (
            group === "horizontal" &&
            (car.direction === "right" || car.direction === "left")
        ) {
            count++;
        }

        if (
            group === "vertical" &&
            (car.direction === "up" || car.direction === "down")
        ) {
            count++;
        }
    }

    return count;
}

function countApproachingCars(group) {
    let count = 0;

    for (const car of cars) {
        if (group === "horizontal") {
            const approaching =
                (car.direction === "right" && car.x > 180 && car.x < 390) ||
                (car.direction === "left" && car.x > 510 && car.x < 720);

            if (approaching) count++;
        }

        if (group === "vertical") {
            const approaching =
                (car.direction === "down" && car.y > 40 && car.y < 230) ||
                (car.direction === "up" && car.y > 270 && car.y < 460);

            if (approaching) count++;
        }
    }

    return count;
}

function calculateGreenTimes() {
    const horizontal = countApproachingCars("horizontal");
    const vertical = countApproachingCars("vertical");

    // 15 seconds minimum, then +2 seconds per nearby car.
    // This now usually produces different timings instead of
    // immediately staying at the 30-second maximum.
    const horizontalTime = Math.min(
        MIN_GREEN_TIME + horizontal * 2,
        MAX_GREEN_TIME
    );

    const verticalTime = Math.min(
        MIN_GREEN_TIME + vertical * 2,
        MAX_GREEN_TIME
    );

    return [horizontalTime, verticalTime];
}

function spawnCar() {
    const directions = ["right", "left", "up", "down"];
    const direction = directions[Math.floor(Math.random() * directions.length)];

    // Don't spawn another car on top of a car already waiting at the entry.
    // This allows very crowded traffic while preventing visual overlap.
    const spawnBlocked = cars.some(car => {
        if (car.direction !== direction) return false;

        if (direction === "right") return car.x < 30;
        if (direction === "left") return car.x > WIDTH - 62;
        if (direction === "down") return car.y < 30;
        if (direction === "up") return car.y > HEIGHT - 62;

        return false;
    });

    if (spawnBlocked) {
        // Try again shortly instead of creating an overlapping car.
        spawnTimer = Math.min(spawnTimer, nextSpawnDelay * 0.5);
        return;
    }

    cars.push(new Car(direction));
    totalCars++;
}

function updateLights(dt) {
    lightTimer += dt;

    if (lightPhase === "horizontal_green" && lightTimer >= horizontalGreenTime) {
        lightPhase = "horizontal_yellow";
        lightTimer = 0;
    }
    else if (lightPhase === "horizontal_yellow" && lightTimer >= YELLOW_TIME) {
        [horizontalGreenTime, verticalGreenTime] = calculateGreenTimes();
        lightPhase = "vertical_green";
        lightTimer = 0;
    }
    else if (lightPhase === "vertical_green" && lightTimer >= verticalGreenTime) {
        lightPhase = "vertical_yellow";
        lightTimer = 0;
    }
    else if (lightPhase === "vertical_yellow" && lightTimer >= YELLOW_TIME) {
        [horizontalGreenTime, verticalGreenTime] = calculateGreenTimes();
        lightPhase = "horizontal_green";
        lightTimer = 0;
    }
}

function updateCars() {
    for (const car of cars) car.move();

    const remaining = [];

    for (const car of cars) {
        const inside =
            car.x > -100 && car.x < WIDTH + 100 &&
            car.y > -100 && car.y < HEIGHT + 100;

        if (inside) remaining.push(car);
        else passedCars++;
    }

    cars = remaining;
}


// Final safety pass: keep cars in each lane physically separated.
// Runs after movement, preventing overlaps during crowded spawn bursts.
function resolveCarOverlaps() {
    const SAFE_GAP = 12;

    for (const direction of ["right", "left", "down", "up"]) {
        const laneCars = cars.filter(car => car.direction === direction);

        if (direction === "right") {
            laneCars.sort((a, b) => b.x - a.x);
            for (let i = 1; i < laneCars.length; i++) {
                const front = laneCars[i - 1], rear = laneCars[i];
                rear.x = Math.min(rear.x, front.x - CAR_WIDTH - SAFE_GAP);
            }
        } else if (direction === "left") {
            laneCars.sort((a, b) => a.x - b.x);
            for (let i = 1; i < laneCars.length; i++) {
                const front = laneCars[i - 1], rear = laneCars[i];
                rear.x = Math.max(rear.x, front.x + CAR_WIDTH + SAFE_GAP);
            }
        } else if (direction === "down") {
            laneCars.sort((a, b) => b.y - a.y);
            for (let i = 1; i < laneCars.length; i++) {
                const front = laneCars[i - 1], rear = laneCars[i];
                rear.y = Math.min(rear.y, front.y - CAR_WIDTH - SAFE_GAP);
            }
        } else if (direction === "up") {
            laneCars.sort((a, b) => a.y - b.y);
            for (let i = 1; i < laneCars.length; i++) {
                const front = laneCars[i - 1], rear = laneCars[i];
                rear.y = Math.max(rear.y, front.y + CAR_WIDTH + SAFE_GAP);
            }
        }
    }
}

function drawRoad() {
    ctx.fillStyle = "#4f944f";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    ctx.fillStyle = "#383838";
    ctx.fillRect(0, ROAD_TOP, WIDTH, ROAD_BOTTOM - ROAD_TOP);
    ctx.fillRect(ROAD_LEFT, 0, ROAD_RIGHT - ROAD_LEFT, HEIGHT);

    ctx.fillStyle = "white";
    for (let x = 0; x < WIDTH; x += 50)
        ctx.fillRect(x, 247, 30, 5);

    for (let y = 0; y < HEIGHT; y += 50)
        ctx.fillRect(447, y, 5, 30);
}

function drawTrafficLight() {
    // Compact realistic signal, completely above the road.
    const x = 276, y = 22, w = 74, h = 124, cx = 313;

    ctx.save();

    // Mounting pole
    const pole = ctx.createLinearGradient(cx - 4, y + h, cx + 4, y + h);
    pole.addColorStop(0, "#444");
    pole.addColorStop(0.5, "#b8b8b8");
    pole.addColorStop(1, "#444");
    ctx.fillStyle = pole;
    ctx.fillRect(cx - 4, y + h - 1, 8, 28);

    // Housing shadow
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    roundRect(x + 3, y + 4, w, h, 9);
    ctx.fill();

    // Metallic housing
    const metal = ctx.createLinearGradient(x, y, x + w, y);
    metal.addColorStop(0, "#1b1b1b");
    metal.addColorStop(0.2, "#555");
    metal.addColorStop(0.5, "#161616");
    metal.addColorStop(0.8, "#4a4a4a");
    metal.addColorStop(1, "#111");
    ctx.fillStyle = metal;
    ctx.strokeStyle = "#999";
    ctx.lineWidth = 1.3;
    roundRect(x, y, w, h, 9);
    ctx.fill();
    ctx.stroke();

    // Black inner face
    ctx.fillStyle = "#070707";
    roundRect(x + 7, y + 7, w - 14, h - 14, 6);
    ctx.fill();

    let active = "red";
    if (lightPhase === "horizontal_yellow" || lightPhase === "vertical_yellow") {
        active = "yellow";
    } else if (lightPhase === "horizontal_green" || lightPhase === "vertical_green") {
        active = "green";
    }

    drawLens(cx, y + 28, 12, "#e53935", active === "red");
    drawLens(cx, y + 62, 12, "#f4c430", active === "yellow");
    drawLens(cx, y + 96, 12, "#32c85a", active === "green");

    ctx.fillStyle = "#d8d8d8";
    ctx.font = "bold 7px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(active === "red" ? "STOP" : active === "yellow" ? "WAIT" : "GO", cx, y + 114);

    ctx.restore();
}

function roundRect(x, y, width, height, radius) {
    const r = Math.min(radius, width / 2, height / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + width, y, x + width, y + height, r);
    ctx.arcTo(x + width, y + height, x, y + height, r);
    ctx.arcTo(x, y + height, x, y, r);
    ctx.arcTo(x, y, x + width, y, r);
    ctx.closePath();
}

function drawLens(x, y, radius, color, active) {
    ctx.save();

    if (active) {
        ctx.shadowColor = color;
        ctx.shadowBlur = 15;
    }

    // Outer black bezel
    ctx.beginPath();
    ctx.fillStyle = "#020202";
    ctx.arc(x, y, radius + 2, 0, Math.PI * 2);
    ctx.fill();

    const grad = ctx.createRadialGradient(
        x - radius * 0.35, y - radius * 0.4, radius * 0.08,
        x, y, radius
    );

    if (active) {
        grad.addColorStop(0, "#fff");
        grad.addColorStop(0.15, color);
        grad.addColorStop(0.58, color);
        grad.addColorStop(1, "#161616");
    } else {
        grad.addColorStop(0, "#303030");
        grad.addColorStop(0.65, "#151515");
        grad.addColorStop(1, "#060606");
    }

    ctx.shadowBlur = active ? 15 : 0;
    ctx.beginPath();
    ctx.fillStyle = grad;
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = active ? color : "#444";
    ctx.lineWidth = 1;
    ctx.stroke();

    // Small glass reflection
    if (active) {
        ctx.beginPath();
        ctx.fillStyle = "rgba(255,255,255,0.6)";
        ctx.ellipse(x - 4, y - 5, 2.5, 1.2, -0.5, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
}
function drawText() {
    ctx.textAlign = "left";
    ctx.fillStyle = "white";

    ctx.font = "bold 14px Arial";
    ctx.fillText(`Total Cars: ${totalCars}`, 20, 20);
    ctx.font = "12px Arial";
    ctx.fillText(`Cars Passed: ${passedCars}`, 20, 45);

    const horizontal = countRoadCars("horizontal");
    const vertical = countRoadCars("vertical");

    ctx.fillText(`Horizontal Cars: ${horizontal}`, 20, 95);
    ctx.fillText(`Vertical Cars: ${vertical}`, 20, 120);

    let remaining, signalName;

    if (lightPhase === "horizontal_green") {
        remaining = horizontalGreenTime - lightTimer;
        signalName = "HORIZONTAL GREEN";
    } else if (lightPhase === "horizontal_yellow") {
        remaining = YELLOW_TIME - lightTimer;
        signalName = "HORIZONTAL YELLOW";
    } else if (lightPhase === "vertical_green") {
        remaining = verticalGreenTime - lightTimer;
        signalName = "VERTICAL GREEN";
    } else {
        remaining = YELLOW_TIME - lightTimer;
        signalName = "VERTICAL YELLOW";
    }

    remaining = Math.max(0, remaining);

    ctx.textAlign = "center";
    ctx.font = "bold 17px Arial";
    ctx.fillText(`${signalName}: ${remaining.toFixed(1)}s`, 720, 35);

    ctx.font = "10px Arial";
    ctx.fillText(
        `Yellow: ${YELLOW_TIME}s`,
        720, 62
    );

    ctx.textAlign = "left";
    ctx.font = "11px Arial";
}

function draw() {
    drawRoad();
    drawTrafficLight();

    for (const car of cars) car.draw();

    drawText();
}

function gameLoop(now) {
    let dt = (now - lastTime) / 1000;
    lastTime = now;

    // Prevent a huge jump if the browser tab was inactive.
    dt = Math.min(dt, 0.1);

    // Dynamic traffic flow:
    // Traffic now comes in quiet, normal, and crowded waves instead of
    // spawning at almost the same rate all the time.
    spawnTimer += dt;

    if (spawnTimer >= nextSpawnDelay) {
        spawnCar();
        spawnTimer = 0;

        // Pick the next gap based on the current traffic wave.
        // Short gaps = crowded, long gaps = vacant.
        const wave = Math.random();

        if (wave < 0.22) {
            // VERY QUIET: long gaps between cars
            nextSpawnDelay = 2.8 + Math.random() * 4.2;
        } else if (wave < 0.62) {
            // NORMAL: moderate traffic
            nextSpawnDelay = 1.0 + Math.random() * 1.8;
        } else if (wave < 0.88) {
            // BUSY: several cars close together
            nextSpawnDelay = 0.35 + Math.random() * 0.7;
        } else {
            // VERY BUSY BURST: cars arrive rapidly
            nextSpawnDelay = 0.18 + Math.random() * 0.35;
        }
    }

    updateLights(dt);

    // Original movement is approximately 20 ms per update.
    // Scale it to real time while keeping the same speed feel.
    const steps = dt / 0.02;
    for (const car of cars) {
        // movement is handled below using the original speed per 20ms
    }

    // Run the same simulation movement proportionally.
    for (const car of cars) {
        for (let i = 0; i < Math.max(1, Math.round(steps)); i++) car.move();
    }

    const remaining = [];
    for (const car of cars) {
        if (car.x > -100 && car.x < WIDTH + 100 &&
            car.y > -100 && car.y < HEIGHT + 100) {
            remaining.push(car);
        } else {
            passedCars++;
        }
    }
    cars = remaining;

    // Final spacing correction after all cars have moved.
    resolveCarOverlaps();

    draw();
    requestAnimationFrame(gameLoop);
}

draw();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
